<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Master - TV Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        /* TV-Optimized invisible/sleek scrollbars */
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }
        
        /* Smooth scrolling for TV D-Pad navigation */
        html { scroll-behavior: smooth; }
        
        /* Prevent selection outline on mouse click, but keep it for keyboard/remote focus */
        :focus:not(:focus-visible) { outline: none; box-shadow: none; transform: none; }
    </style>
</head>
<body class="bg-[#0a0a0a] text-gray-100 h-screen w-screen overflow-hidden font-sans flex select-none">

    <!-- TV Sidebar: Settings & Filters -->
    <aside class="w-80 md:w-96 bg-[#121212] border-r border-white/10 flex flex-col h-full flex-shrink-0 z-20 shadow-2xl">
        <!-- Logo Area -->
        <div class="p-6 pb-4 border-b border-white/10 flex items-center gap-4">
            <span class="text-4xl">📺</span>
            <div>
                <h1 class="text-2xl font-black tracking-wider text-white uppercase">IPTV Master</h1>
                <p class="text-xs text-gray-400 font-semibold tracking-widest">TV OS EDITION</p>
            </div>
        </div>

        <!-- Scrollable Filters -->
        <div class="flex-grow overflow-y-auto p-6 space-y-8">
            
            <!-- Load Source -->
            <section class="space-y-3">
                <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-2">1. Load Source</h2>
                <input type="text" id="urlInput" placeholder="Enter M3U8 URL..." class="w-full bg-white/5 border border-white/10 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-4 focus:ring-blue-500 transition-all text-lg" tabindex="0">
                <div class="flex gap-2">
                    <button id="fetchUrlBtn" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:ring-4 focus:ring-white focus:scale-105 transition-all shadow-lg" tabindex="0">
                        Fetch URL
                    </button>
                    <label class="flex-1 bg-white/10 hover:bg-white/20 text-white font-bold py-3 px-4 rounded-lg focus-within:ring-4 focus-within:ring-white focus-within:scale-105 transition-all text-center cursor-pointer shadow-lg">
                        <span>Local File</span>
                        <input type="file" id="fileInput" accept=".m3u,.m3u8,.txt" class="hidden" tabindex="0">
                    </label>
                </div>
            </section>

            <!-- Search -->
            <section>
                <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-2">2. Search</h2>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-400 text-xl">🔍</span>
                    <input type="text" id="searchInput" placeholder="Search channels..." class="w-full bg-white/5 border border-white/10 rounded-lg pl-12 pr-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:ring-4 focus:ring-blue-500 transition-all text-lg" tabindex="0">
                </div>
            </section>

            <!-- Tools -->
            <section class="space-y-3">
                <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-2">3. Tools & Status</h2>
                
                <button id="testStreamsBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:ring-4 focus:ring-white focus:scale-105 transition-all shadow-lg flex items-center justify-center gap-3 text-lg" tabindex="0">
                    <span>📡</span> Test Playability (BD)
                </button>
                
                <div id="testProgress" class="hidden w-full bg-white/10 rounded-full h-2 overflow-hidden">
                    <div id="testProgressBar" class="bg-indigo-400 h-2 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>

                <button id="filterWorkingBtn" class="w-full bg-white/5 border border-white/10 hover:bg-white/10 text-white font-bold py-3 px-4 rounded-lg focus:outline-none focus:ring-4 focus:ring-white focus:scale-105 transition-all flex items-center justify-center gap-3 text-lg" tabindex="0">
                    <span class="grayscale opacity-50" id="workingBtnIcon">🟢</span> Show Working Only
                </button>
            </section>

            <!-- Categories -->
            <section>
                <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-3">4. Categories</h2>
                <div class="flex flex-wrap gap-2" id="categoryFilters">
                    <!-- JS Injected -->
                </div>
            </section>

            <!-- Regions -->
            <section>
                <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-3">5. Regions</h2>
                <div class="flex flex-wrap gap-2" id="regionFilters">
                    <!-- JS Injected -->
                </div>
            </section>

            <!-- Export -->
            <section class="pb-8">
                <h2 class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-3">6. Export</h2>
                <div class="flex gap-2">
                    <button id="exportJsonBtn" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-2 rounded-lg focus:outline-none focus:ring-4 focus:ring-white focus:scale-105 transition-all shadow-lg" tabindex="0">
                        JSON
                    </button>
                    <button id="exportM3u8Btn" class="flex-1 bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-2 rounded-lg focus:outline-none focus:ring-4 focus:ring-white focus:scale-105 transition-all shadow-lg" tabindex="0">
                        M3U8
                    </button>
                </div>
            </section>

        </div>
    </aside>

    <!-- Main TV Content Area -->
    <main class="flex-1 flex flex-col h-full bg-[#0a0a0a] relative overflow-hidden">
        
        <!-- Large Video Player (Cinematic Header) -->
        <div class="w-full bg-black flex-shrink-0 relative z-10 shadow-2xl border-b border-white/10" style="height: 45vh;">
            <video id="videoPlayer" class="w-full h-full object-contain" controls></video>
            
            <div id="playerOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black/60 backdrop-blur-sm pointer-events-none transition-opacity duration-300">
                <span class="text-6xl mb-4 drop-shadow-2xl opacity-80">🍿</span>
                <h2 class="text-2xl font-bold tracking-widest text-white/80">SELECT A CHANNEL TO PLAY</h2>
            </div>
            
            <!-- Now Playing Gradient Overlay -->
            <div class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-black/90 via-black/50 to-transparent pointer-events-none">
                <div class="flex items-end justify-between">
                    <div>
                        <span id="nowPlayingGroup" class="text-blue-400 font-bold tracking-wider text-sm uppercase mb-1 block drop-shadow-md">NO CHANNEL SELECTED</span>
                        <h2 id="nowPlayingName" class="text-4xl font-black text-white drop-shadow-lg truncate max-w-3xl">Standby</h2>
                    </div>
                </div>
            </div>
        </div>

        <!-- Channel Grid Area -->
        <div class="flex-1 overflow-y-auto p-6 md:p-8 relative">
            <div class="flex justify-between items-end mb-6">
                <h2 class="text-2xl font-bold text-white">Channel Lineup</h2>
                <span id="channelCount" class="text-lg font-mono text-gray-400 bg-white/5 px-4 py-1 rounded-full border border-white/10">0 Channels</span>
            </div>

            <!-- Grid Container -->
            <div id="channelGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 md:gap-6 pb-20">
                <div class="col-span-full text-center py-20 text-gray-500 text-xl font-medium">
                    Please load an M3U playlist from the sidebar to begin.
                </div>
            </div>
        </div>
    </main>

    <!-- TV Export Modal -->
    <div id="exportModal" class="fixed inset-0 bg-black/90 backdrop-blur-md hidden items-center justify-center z-50 p-8">
        <div class="bg-[#121212] rounded-2xl border border-white/20 w-full max-w-5xl flex flex-col shadow-2xl h-[85vh] overflow-hidden transform scale-100 transition-transform">
            <div class="p-6 border-b border-white/10 flex justify-between items-center bg-white/5">
                <h3 id="exportModalTitle" class="text-2xl font-bold text-white">Exported Data</h3>
                <button id="closeModalBtn" class="text-gray-400 hover:text-white focus:text-white focus:outline-none focus:ring-4 focus:ring-white rounded-full p-2 transition-all" tabindex="0">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            <div class="p-6 flex-grow relative">
                <textarea id="exportArea" class="w-full h-full bg-[#0a0a0a] text-emerald-400 font-mono text-lg p-6 rounded-xl border border-white/10 focus:outline-none focus:ring-4 focus:ring-blue-500 resize-none shadow-inner" spellcheck="false" tabindex="0"></textarea>
            </div>
            <div class="p-6 border-t border-white/10 flex justify-end bg-white/5">
                <button id="copyExportBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-8 py-4 rounded-xl font-bold text-lg focus:outline-none focus:ring-4 focus:ring-white focus:scale-105 transition-all shadow-lg" tabindex="0">
                    Copy to Clipboard
                </button>
            </div>
        </div>
    </div>

    <script>
        // State
        let allChannels = [];
        let activeCategories = new Set();
        let activeRegions = new Set();
        let searchQuery = "";
        let filterWorkingOnly = false;
        let isTesting = false;
        let hls = null;

        // Configuration (Expanded for TV Edition)
        const filterConfig = {
            categories: [
                { id: 'sports', label: 'Sports 🏃', keywords: ['sport', 'espn', 'tnt', 'beinsports', 'fox sports', 'arena'] },
                { id: 'motorsports', label: 'Motorsports 🏎️', keywords: ['motor', 'racing', 'f1', 'formula', 'speed'] },
                { id: 'movie', label: 'Movies 🎬', keywords: ['movie', 'film', 'cinema', 'hbo', 'star movies', 'cinemax'] },
                { id: 'news', label: 'News 📰', keywords: ['news', 'bbc', 'cnn', 'al jazeera', 'sky news', 'fox news'] },
                { id: 'kids', label: 'Kids 🧸', keywords: ['kid', 'cartoon', 'animation', 'disney', 'nickelodeon', 'cn'] },
                { id: 'music', label: 'Music 🎵', keywords: ['music', 'mtv', 'vh1', 'concert', 'pop', 'rock'] },
                { id: 'doc', label: 'Doc/Nature 🌍', keywords: ['doc', 'nature', 'discovery', 'national geographic', 'history', 'animal'] },
                { id: 'entertainment', label: 'Entertainment 🎭', keywords: ['entertainment', 'comedy', 'show', 'life', 'tlc'] },
                { id: 'religion', label: 'Religion 🕌', keywords: ['religion', 'islam', 'quran', 'peace tv', 'christian', 'faith'] }
            ],
            regions: [
                { id: 'bd', label: 'Bangladesh 🇧🇩', keywords: ['bangladesh', 'bd', 'bengali', 'dhaka', 'somoy', 'jamuna'] },
                { id: 'in', label: 'India 🇮🇳', keywords: ['india', 'in', 'hindi', 'tamil', 'telugu', 'star', 'colors'] },
                { id: 'pk', label: 'Pakistan 🇵🇰', keywords: ['pakistan', 'pk', 'urdu', 'ary', 'geo', 'hum'] },
                { id: 'us', label: 'USA 🇺🇸', keywords: ['usa', 'us', 'united states', 'american'] },
                { id: 'uk', label: 'UK 🇬🇧', keywords: ['uk', 'united kingdom', 'british', 'bbc'] },
                { id: 'me', label: 'Middle East 🐪', keywords: ['arabic', 'arab', 'middle east', 'uae', 'saudi', 'mbc', 'dubai'] },
                { id: 'eu', label: 'Europe 🇪🇺', keywords: ['europe', 'eu', 'france', 'germany', 'italy', 'spain'] },
                { id: 'latam', label: 'LatAm 🌎', keywords: ['latino', 'spanish', 'argentina', 'mexico', 'chile', 'colombia'] }
            ]
        };

        // DOM Elements
        const DOM = {
            urlInput: document.getElementById('urlInput'),
            fetchUrlBtn: document.getElementById('fetchUrlBtn'),
            fileInput: document.getElementById('fileInput'),
            channelGrid: document.getElementById('channelGrid'),
            channelCount: document.getElementById('channelCount'),
            categoryFilters: document.getElementById('categoryFilters'),
            regionFilters: document.getElementById('regionFilters'),
            searchInput: document.getElementById('searchInput'),
            videoPlayer: document.getElementById('videoPlayer'),
            playerOverlay: document.getElementById('playerOverlay'),
            nowPlayingName: document.getElementById('nowPlayingName'),
            nowPlayingGroup: document.getElementById('nowPlayingGroup'),
            testStreamsBtn: document.getElementById('testStreamsBtn'),
            testProgress: document.getElementById('testProgress'),
            testProgressBar: document.getElementById('testProgressBar'),
            filterWorkingBtn: document.getElementById('filterWorkingBtn'),
            workingBtnIcon: document.getElementById('workingBtnIcon'),
            exportJsonBtn: document.getElementById('exportJsonBtn'),
            exportM3u8Btn: document.getElementById('exportM3u8Btn'),
            exportModal: document.getElementById('exportModal'),
            exportModalTitle: document.getElementById('exportModalTitle'),
            exportArea: document.getElementById('exportArea'),
            closeModalBtn: document.getElementById('closeModalBtn'),
            copyExportBtn: document.getElementById('copyExportBtn')
        };

        // Initialize UI
        function initUI() {
            // Build Filter Buttons (TV Style)
            filterConfig.categories.forEach(cat => {
                const btn = createTVFilterButton(cat.label, () => toggleFilter(activeCategories, cat.id, btn));
                DOM.categoryFilters.appendChild(btn);
            });

            filterConfig.regions.forEach(reg => {
                const btn = createTVFilterButton(reg.label, () => toggleFilter(activeRegions, reg.id, btn));
                DOM.regionFilters.appendChild(btn);
            });

            DOM.fileInput.addEventListener('change', handleFileUpload);
            DOM.fetchUrlBtn.addEventListener('click', handleUrlFetch);
            
            // Allow 'Enter' key to trigger fetch
            DOM.urlInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleUrlFetch();
            });

            DOM.searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                renderChannels();
            });

            DOM.filterWorkingBtn.addEventListener('click', () => {
                filterWorkingOnly = !filterWorkingOnly;
                if(filterWorkingOnly) {
                    DOM.filterWorkingBtn.classList.replace('bg-white/5', 'bg-emerald-600/20');
                    DOM.filterWorkingBtn.classList.replace('border-white/10', 'border-emerald-500');
                    DOM.workingBtnIcon.classList.remove('grayscale', 'opacity-50');
                } else {
                    DOM.filterWorkingBtn.classList.replace('bg-emerald-600/20', 'bg-white/5');
                    DOM.filterWorkingBtn.classList.replace('border-emerald-500', 'border-white/10');
                    DOM.workingBtnIcon.classList.add('grayscale', 'opacity-50');
                }
                renderChannels();
            });

            DOM.testStreamsBtn.addEventListener('click', runPlayabilityTest);

            DOM.exportJsonBtn.addEventListener('click', () => generateExport('json'));
            DOM.exportM3u8Btn.addEventListener('click', () => generateExport('m3u8'));
            DOM.closeModalBtn.addEventListener('click', () => DOM.exportModal.classList.replace('flex', 'hidden'));
            DOM.copyExportBtn.addEventListener('click', copyExport);
        }

        function createTVFilterButton(label, onClick) {
            const btn = document.createElement('button');
            btn.className = "px-4 py-2 bg-white/5 hover:bg-white/10 text-gray-300 rounded-lg text-sm font-bold transition-all border border-white/10 focus:outline-none focus:ring-4 focus:ring-white focus:scale-105";
            btn.textContent = label;
            btn.tabIndex = 0;
            btn.addEventListener('click', onClick);
            return btn;
        }

        function toggleFilter(set, id, btnElement) {
            if (set.has(id)) {
                set.delete(id);
                btnElement.classList.remove('bg-blue-600', 'text-white', 'border-blue-500');
                btnElement.classList.add('bg-white/5', 'text-gray-300', 'border-white/10');
            } else {
                set.add(id);
                btnElement.classList.remove('bg-white/5', 'text-gray-300', 'border-white/10');
                btnElement.classList.add('bg-blue-600', 'text-white', 'border-blue-500');
            }
            renderChannels();
        }

        function parseM3U8(data) {
            const lines = data.split('\n');
            const parsed = [];
            let current = null;

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const nameParts = line.split(',');
                    const name = nameParts.length > 1 ? nameParts.slice(1).join(',').trim() : "Unknown";
                    
                    const groupMatch = line.match(/group-title="([^"]+)"/i);
                    const countryMatch = line.match(/tvg-country="([^"]+)"/i);
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/i);

                    current = {
                        name: name.replace(/"/g, '\\"'),
                        group: groupMatch ? groupMatch[1] : 'Uncategorized',
                        country: countryMatch ? countryMatch[1] : '',
                        logo: logoMatch ? logoMatch[1] : null,
                        rawSearchString: `${name} ${groupMatch ? groupMatch[1] : ''} ${countryMatch ? countryMatch[1] : ''}`.toLowerCase(),
                        status: 'untested' 
                    };
                } else if (line.startsWith('http') && current) {
                    current.url = line;
                    parsed.push(current);
                    current = null;
                }
            }
            return parsed;
        }

        async function handleUrlFetch() {
            const url = DOM.urlInput.value.trim();
            if (!url) return alert('Please enter a URL');
            
            DOM.fetchUrlBtn.textContent = 'Loading...';
            DOM.channelGrid.innerHTML = '<div class="col-span-full text-center py-20 text-gray-400 text-2xl font-bold animate-pulse">Fetching & Parsing...</div>';

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.text();
                allChannels = parseM3U8(data);
                renderChannels();
            } catch (err) {
                DOM.channelGrid.innerHTML = `<div class="col-span-full text-center py-20 text-red-400 text-xl"><span class="text-4xl block mb-4">⚠️</span> Error: ${err.message}.<br><br>Tip: If fetching fails due to CORS, download the file to your computer and use the <b>Local File</b> button instead.</div>`;
            } finally {
                DOM.fetchUrlBtn.textContent = 'Fetch URL';
            }
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            DOM.channelGrid.innerHTML = '<div class="col-span-full text-center py-20 text-gray-400 text-2xl font-bold animate-pulse">Reading Local File...</div>';
            
            reader.onload = function(event) {
                const data = event.target.result;
                allChannels = parseM3U8(data);
                renderChannels();
            };
            reader.readAsText(file);
        }

        function getFilteredChannels() {
            return allChannels.filter(ch => {
                if (filterWorkingOnly && ch.status !== 'working') return false;
                if (searchQuery && !ch.rawSearchString.includes(searchQuery)) return false;

                let matchesCategory = activeCategories.size === 0;
                if (activeCategories.size > 0) {
                    for (const catId of activeCategories) {
                        const catConfig = filterConfig.categories.find(c => c.id === catId);
                        if (catConfig.keywords.some(kw => ch.rawSearchString.includes(kw))) {
                            matchesCategory = true;
                            break;
                        }
                    }
                }
                if (!matchesCategory) return false;

                let matchesRegion = activeRegions.size === 0;
                if (activeRegions.size > 0) {
                    for (const regId of activeRegions) {
                        const regConfig = filterConfig.regions.find(r => r.id === regId);
                        if (ch.country.toLowerCase() === regId || regConfig.keywords.some(kw => ch.rawSearchString.includes(kw))) {
                            matchesRegion = true;
                            break;
                        }
                    }
                }
                if (!matchesRegion) return false;

                return true;
            });
        }

        function renderChannels() {
            const filtered = getFilteredChannels();
            DOM.channelCount.textContent = `${filtered.length} Channels`;
            DOM.channelGrid.innerHTML = '';

            if (filtered.length === 0) {
                DOM.channelGrid.innerHTML = '<div class="col-span-full text-center py-20 text-gray-500 text-xl font-medium">No channels match your current filters.</div>';
                return;
            }

            const fragment = document.createDocumentFragment();
            const displayLimit = Math.min(filtered.length, 500); // Grid renders are heavier, limit to 500

            for (let i = 0; i < displayLimit; i++) {
                const ch = filtered[i];
                
                // TV Card Design
                const btn = document.createElement('button');
                btn.className = "group relative flex flex-col items-center justify-center p-4 bg-[#1a1a1a] rounded-xl border border-white/5 hover:border-white/30 hover:bg-[#222] focus:border-white focus:ring-4 focus:ring-white/50 focus:scale-105 transition-all aspect-video outline-none shadow-lg overflow-hidden";
                btn.tabIndex = 0;

                // Status Indicator
                let statusRing = '';
                let statusDot = '';
                if (ch.status === 'working') {
                    statusRing = 'ring-2 ring-emerald-500 border-emerald-500';
                    statusDot = '<div class="absolute top-3 right-3 w-3 h-3 bg-emerald-500 rounded-full shadow-[0_0_8px_rgba(16,185,129,0.8)] z-10"></div>';
                } else if (ch.status === 'error') {
                    statusRing = 'opacity-50 grayscale border-red-900';
                    statusDot = '<div class="absolute top-3 right-3 w-3 h-3 bg-red-600 rounded-full z-10"></div>';
                }
                
                if(statusRing) btn.className += ` ${statusRing}`;

                btn.onclick = () => {
                    playStream(ch.url, ch.name, ch.group);
                    // Scroll back to top to view player easily
                    window.scrollTo({top: 0, behavior: 'smooth'});
                };

                const icon = getEmojiForGroup(ch.group);
                
                btn.innerHTML = `
                    ${statusDot}
                    <div class="flex-grow flex items-center justify-center w-full mb-3 z-0 relative">
                        ${ch.logo 
                            ? `<img src="${ch.logo}" class="max-h-16 max-w-[80%] object-contain drop-shadow-md transition-transform group-hover:scale-110 group-focus:scale-110" onerror="this.outerHTML='<span class=\\'text-5xl opacity-80\\'>${icon}</span>'">` 
                            : `<span class="text-5xl opacity-80 transition-transform group-hover:scale-110 group-focus:scale-110">${icon}</span>`
                        }
                    </div>
                    <div class="w-full text-center mt-auto z-10 bg-gradient-to-t from-[#1a1a1a] pt-2">
                        <h3 class="text-white font-bold text-sm md:text-base truncate drop-shadow-md w-full px-2">${ch.name}</h3>
                        <div class="flex justify-center items-center gap-2 mt-1">
                            ${ch.country ? `<span class="text-[10px] text-gray-400 border border-gray-600 px-1 rounded uppercase tracking-wider">${ch.country}</span>` : ''}
                            <span class="text-xs text-blue-400 font-medium truncate max-w-[60%]">${ch.group}</span>
                        </div>
                    </div>
                `;
                fragment.appendChild(btn);
            }
            
            if(filtered.length > 500) {
                const warning = document.createElement('div');
                warning.className = "col-span-full text-center py-8 text-sm text-amber-500 bg-amber-500/10 rounded-xl border border-amber-500/20";
                warning.textContent = `Showing 500 of ${filtered.length} results. Use filters or search to narrow down to avoid TV lag.`;
                fragment.appendChild(warning);
            }

            DOM.channelGrid.appendChild(fragment);
        }

        // --- Geoblock / Playability Tester ---
        async function runPlayabilityTest() {
            if (isTesting) return;
            const filtered = getFilteredChannels();
            
            if (filtered.length === 0) return alert("No channels to test.");
            if (filtered.length > 300) {
                const proceed = confirm(`You are about to test ${filtered.length} channels. This might take a while on a TV browser. Proceed?`);
                if (!proceed) return;
            }

            isTesting = true;
            DOM.testStreamsBtn.innerHTML = `<span class="animate-spin">⏳</span> Testing...`;
            DOM.testStreamsBtn.classList.replace('bg-indigo-600', 'bg-gray-600');
            DOM.testProgress.classList.remove('hidden');
            
            let completed = 0;
            
            const testStream = (channel) => {
                return new Promise((resolve) => {
                    if (!Hls.isSupported()) return resolve(); 
                    
                    const hlsTest = new Hls({ debug: false, maxMaxBufferLength: 1, maxBufferLength: 1 });
                    
                    const timeout = setTimeout(() => {
                        channel.status = 'error';
                        hlsTest.destroy();
                        resolve();
                    }, 4000);

                    hlsTest.on(Hls.Events.MANIFEST_PARSED, () => {
                        clearTimeout(timeout);
                        channel.status = 'working';
                        hlsTest.destroy();
                        resolve();
                    });

                    hlsTest.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) {
                            clearTimeout(timeout);
                            channel.status = 'error';
                            hlsTest.destroy();
                            resolve();
                        }
                    });

                    hlsTest.loadSource(channel.url);
                });
            };

            const chunkSize = 3;
            for (let i = 0; i < filtered.length; i += chunkSize) {
                const chunk = filtered.slice(i, i + chunkSize);
                await Promise.all(chunk.map(ch => testStream(ch)));
                
                completed += chunk.length;
                const percent = Math.min(100, Math.round((completed / filtered.length) * 100));
                DOM.testProgressBar.style.width = `${percent}%`;
                
                if (i % 15 === 0) renderChannels(); 
            }

            renderChannels();
            isTesting = false;
            DOM.testStreamsBtn.innerHTML = `<span>✔️</span> Test Complete!`;
            DOM.testStreamsBtn.classList.replace('bg-gray-600', 'bg-emerald-600');
            
            setTimeout(() => {
                DOM.testProgress.classList.add('hidden');
                DOM.testProgressBar.style.width = `0%`;
                DOM.testStreamsBtn.innerHTML = `<span>📡</span> Test Playability (BD)`;
                DOM.testStreamsBtn.classList.replace('bg-emerald-600', 'bg-indigo-600');
            }, 4000);
        }

        // --- Player ---
        function playStream(url, name, group) {
            DOM.playerOverlay.style.opacity = '0';
            DOM.nowPlayingName.textContent = name;
            DOM.nowPlayingGroup.textContent = group || 'Unknown Category';

            if (hls) {
                hls.destroy();
            }

            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(DOM.videoPlayer);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    DOM.videoPlayer.play().catch(e => console.log("Autoplay prevented", e));
                });
                hls.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) {
                        console.error('HLS error:', data);
                        DOM.nowPlayingName.textContent = "Error playing stream (Geoblocked/Offline)";
                        DOM.nowPlayingName.classList.add('text-red-500');
                    }
                });
            } 
            else if (DOM.videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                DOM.videoPlayer.src = url;
                DOM.videoPlayer.addEventListener('loadedmetadata', function() {
                    DOM.videoPlayer.play();
                });
            }
        }

        // --- Exports ---
        function getEmojiForGroup(group) {
            const g = (group || '').toUpperCase();
            if (g.includes('SPORT')) return '🏃';
            if (g.includes('MOTOR') || g.includes('F1')) return '🏎️';
            if (g.includes('NEWS')) return '📰';
            if (g.includes('MOVIE') || g.includes('FILM')) return '🎬';
            if (g.includes('KID') || g.includes('CHILD')) return '🧸';
            if (g.includes('MUSIC')) return '🎵';
            if (g.includes('DOC') || g.includes('NATURE')) return '🌍';
            if (g.includes('RELIGION')) return '🕌';
            if (g.includes('COMEDY') || g.includes('ENTERTAIN')) return '🎭';
            return '📺';
        }

        function generateExport(format) {
            const filtered = getFilteredChannels();
            if (filtered.length === 0) return alert("No channels to export. Please adjust filters.");

            if (format === 'json') {
                DOM.exportModalTitle.textContent = "Exported JSON Data";
                const jsonStrings = filtered.map(ch => {
                    const icon = getEmojiForGroup(ch.group);
                    return `{"name":"${ch.name}", "url":"${ch.url}", "icon":"${icon}", "group":"${ch.group}"}`;
                });
                DOM.exportArea.value = jsonStrings.join(',\n') + (jsonStrings.length > 0 ? ',' : '');
            } 
            else if (format === 'm3u8') {
                DOM.exportModalTitle.textContent = "Exported M3U8 Playlist";
                let m3u8Content = "#EXTM3U\n";
                filtered.forEach(ch => {
                    m3u8Content += `#EXTINF:-1 group-title="${ch.group}" tvg-country="${ch.country}" tvg-logo="${ch.logo || ''}",${ch.name}\n${ch.url}\n`;
                });
                DOM.exportArea.value = m3u8Content;
            }

            DOM.exportModal.classList.replace('hidden', 'flex');
            // Auto focus the close button for easy TV dismissal
            setTimeout(() => DOM.closeModalBtn.focus(), 100);
        }

        function copyExport() {
            DOM.exportArea.select();
            document.execCommand('copy');
            
            const originalText = DOM.copyExportBtn.textContent;
            DOM.copyExportBtn.textContent = 'Copied successfully!';
            DOM.copyExportBtn.classList.replace('bg-blue-600', 'bg-emerald-600');
            DOM.copyExportBtn.classList.replace('hover:bg-blue-500', 'hover:bg-emerald-500');
            
            setTimeout(() => {
                DOM.copyExportBtn.textContent = originalText;
                DOM.copyExportBtn.classList.replace('bg-emerald-600', 'bg-blue-600');
                DOM.copyExportBtn.classList.replace('hover:bg-emerald-500', 'hover:bg-blue-500');
            }, 2500);
        }

        // Initialize App
        initUI();

    </script>
</body>
</html>
