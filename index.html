<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiveShi - Pro TV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.3); }
        html { scroll-behavior: smooth; }
        .focus-ring { @apply focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500/50; }
    </style>
</head>
<body class="bg-[#050505] text-gray-200 h-screen w-screen overflow-hidden font-sans flex select-none">

    <!-- Sidebar: Navigation & Filters -->
    <aside class="w-72 md:w-80 bg-[#0a0a0a] border-r border-white/5 flex flex-col h-full flex-shrink-0 z-20 shadow-2xl">
        <!-- Logo Area -->
        <div class="p-6 border-b border-white/5 flex items-center gap-4">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-600/20 text-xl">📺</div>
            <div>
                <h1 class="text-xl font-bold tracking-tight text-white">LiveShi</h1>
                <p class="text-[10px] text-gray-500 font-bold tracking-widest uppercase">TV Edition</p>
            </div>
        </div>

        <!-- Scrollable Navigation -->
        <div class="flex-grow overflow-y-auto p-4 space-y-6">
            
            <!-- Settings Toggle -->
            <div>
                <button id="openSettingsBtn" class="w-full flex items-center gap-3 px-4 py-3 bg-white/5 hover:bg-white/10 text-white rounded-xl font-semibold transition-all border border-white/5 focus-ring">
                    <span class="text-xl">⚙️</span>
                    <span>Settings & Provider</span>
                </button>
            </div>

            <!-- Categories -->
            <section>
                <h2 class="text-xs font-bold text-gray-600 uppercase tracking-widest mb-3 px-2">Categories</h2>
                <div class="flex flex-wrap gap-1.5" id="categoryFilters">
                    <!-- JS Injected -->
                </div>
            </section>

            <!-- Regions -->
            <section class="pb-6">
                <h2 class="text-xs font-bold text-gray-600 uppercase tracking-widest mb-3 px-2">Regions</h2>
                <div class="flex flex-wrap gap-1.5" id="regionFilters">
                    <!-- JS Injected -->
                </div>
            </section>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full bg-[#050505] relative overflow-hidden">
        
        <!-- Top Header: Search & Info -->
        <header class="h-20 border-b border-white/5 flex items-center justify-between px-6 lg:px-10 bg-[#050505]/80 backdrop-blur-md z-30 sticky top-0 shrink-0">
            <div class="relative w-full max-w-md">
                <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-500">🔍</span>
                <input type="text" id="searchInput" placeholder="Search channels, categories, or regions..." class="w-full bg-[#111] border border-white/5 rounded-full pl-12 pr-4 py-2.5 text-sm text-white placeholder-gray-600 transition-all focus-ring shadow-inner">
            </div>
            <div class="hidden sm:flex items-center gap-3">
                <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_8px_rgba(16,185,129,0.8)]"></div>
                <span id="channelCount" class="text-sm font-mono text-gray-400 font-medium tracking-wide">0 Channels</span>
            </div>
        </header>

        <!-- Video Player (Cinematic) -->
        <div class="w-full bg-black flex-shrink-0 relative shadow-[0_10px_40px_rgba(0,0,0,0.8)] border-b border-white/5" style="height: 38vh;">
            <video id="videoPlayer" class="w-full h-full object-contain bg-black" controls></video>
            
            <div id="playerOverlay" class="absolute inset-0 flex flex-col items-center justify-center bg-black/80 backdrop-blur-sm pointer-events-none transition-opacity duration-500">
                <span class="text-5xl mb-4 opacity-50">🍿</span>
                <h2 class="text-lg font-bold tracking-widest text-white/50 uppercase">Select a channel to play</h2>
            </div>
            
            <!-- Now Playing Overlay -->
            <div class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-black via-black/60 to-transparent pointer-events-none">
                <span id="nowPlayingGroup" class="text-blue-500 font-bold tracking-wider text-[10px] uppercase mb-1 block">NO CHANNEL SELECTED</span>
                <h2 id="nowPlayingName" class="text-2xl lg:text-3xl font-black text-white truncate max-w-3xl">Standby</h2>
            </div>
        </div>

        <!-- Channel Grid Area -->
        <div class="flex-1 overflow-y-auto p-6 lg:p-10 relative">
            <div id="channelGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 2xl:grid-cols-6 gap-4 pb-12">
                <div class="col-span-full text-center py-20 text-gray-600 text-sm font-medium animate-pulse">
                    Initializing provider...
                </div>
            </div>
        </div>
    </main>

    <!-- Settings Overlay -->
    <div id="settingsOverlay" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-50 p-4 transition-opacity duration-300 opacity-0">
        <div class="bg-[#0f0f0f] rounded-2xl border border-white/10 w-full max-w-md flex flex-col shadow-2xl transform scale-95 transition-transform duration-300" id="settingsContent">
            
            <!-- Modal Header -->
            <div class="p-5 border-b border-white/5 flex justify-between items-center">
                <h3 class="text-lg font-bold text-white flex items-center gap-2">
                    <span>⚙️</span> Settings & Tools
                </h3>
                <button id="closeSettingsBtn" class="text-gray-500 hover:text-white bg-white/5 hover:bg-white/10 rounded-full w-8 h-8 flex items-center justify-center transition-colors">
                    &times;
                </button>
            </div>
            
            <!-- Modal Body -->
            <div class="p-6 space-y-8">
                
                <!-- 1. Load Source -->
                <section>
                    <h4 class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-3">1. Provider Source</h4>
                    <!-- Default URL pre-filled here -->
                    <input type="text" id="urlInput" value="https://raw.githubusercontent.com/imShakil/tvlink/refs/heads/main/iptv.m3u8" class="w-full bg-[#050505] border border-white/10 rounded-xl px-4 py-2.5 text-sm text-gray-300 mb-3 focus-ring">
                    <div class="flex gap-2">
                        <button id="fetchUrlBtn" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl shadow-lg transition-colors text-sm">
                            Fetch Playlist
                        </button>
                        <label class="flex-1 bg-white/5 hover:bg-white/10 text-white font-semibold py-2.5 rounded-xl transition-colors text-center cursor-pointer border border-white/5 text-sm">
                            <span>Local File</span>
                            <input type="file" id="fileInput" accept=".m3u,.m3u8,.txt" class="hidden">
                        </label>
                    </div>
                </section>

                <!-- 2. Tools & Status -->
                <section>
                    <h4 class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-3">2. Tools & Status</h4>
                    <div class="space-y-2">
                        <button id="testStreamsBtn" class="w-full bg-indigo-600/20 text-indigo-400 hover:bg-indigo-600/30 border border-indigo-500/20 font-semibold py-2.5 rounded-xl transition-colors flex items-center justify-center gap-2 text-sm">
                            <span>📡</span> Test Playability (BD)
                        </button>
                        <div id="testProgress" class="hidden w-full bg-[#050505] rounded-full h-1.5 overflow-hidden border border-white/5">
                            <div id="testProgressBar" class="bg-indigo-500 h-full transition-all duration-300" style="width: 0%"></div>
                        </div>
                        <button id="filterWorkingBtn" class="w-full bg-[#050505] border border-white/10 hover:border-white/20 text-gray-400 font-semibold py-2.5 rounded-xl transition-all flex items-center justify-center gap-2 text-sm">
                            <div class="w-2 h-2 rounded-full bg-gray-600" id="workingBtnIcon"></div> Show Working Only
                        </button>
                    </div>
                </section>

                <!-- 3. Export -->
                <section>
                    <h4 class="text-[10px] font-bold text-gray-500 uppercase tracking-widest mb-3">3. Export Data</h4>
                    <div class="flex gap-2">
                        <button id="exportJsonBtn" class="flex-1 bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600/30 border border-emerald-500/20 font-semibold py-2.5 rounded-xl transition-colors text-sm">
                            Export JSON
                        </button>
                        <button id="exportM3u8Btn" class="flex-1 bg-emerald-600/20 text-emerald-400 hover:bg-emerald-600/30 border border-emerald-500/20 font-semibold py-2.5 rounded-xl transition-colors text-sm">
                            Export M3U8
                        </button>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- Export View Modal -->
    <div id="exportModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-[60] p-6">
        <div class="bg-[#0f0f0f] rounded-2xl border border-white/10 w-full max-w-4xl flex flex-col shadow-2xl h-[70vh]">
            <div class="p-4 border-b border-white/5 flex justify-between items-center">
                <h3 id="exportModalTitle" class="text-sm font-bold text-white uppercase tracking-widest">Exported Data</h3>
                <button id="closeExportBtn" class="text-gray-500 hover:text-white">&times;</button>
            </div>
            <div class="p-4 flex-grow relative bg-[#050505]">
                <textarea id="exportArea" class="w-full h-full bg-transparent text-emerald-400 font-mono text-sm border-none focus:outline-none resize-none" spellcheck="false"></textarea>
            </div>
            <div class="p-4 border-t border-white/5 flex justify-end">
                <button id="copyExportBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-xl font-semibold text-sm transition-colors">
                    Copy to Clipboard
                </button>
            </div>
        </div>
    </div>

    <script>
        // State
        let allChannels = [];
        let activeCategories = new Set();
        let activeRegions = new Set();
        let searchQuery = "";
        let filterWorkingOnly = false;
        let isTesting = false;
        let hls = null;

        // Configuration
        const filterConfig = {
            categories: [
                { id: 'sports', label: 'Sports', keywords: ['sport', 'espn', 'tnt', 'bein', 'fox sports', 'arena', 'tsports'] },
                { id: 'movie', label: 'Movies', keywords: ['movie', 'film', 'cinema', 'hbo', 'star movies', 'cinemax'] },
                { id: 'news', label: 'News', keywords: ['news', 'bbc', 'cnn', 'al jazeera', 'somoy', 'jamuna'] },
                { id: 'kids', label: 'Kids', keywords: ['kid', 'cartoon', 'animation', 'disney', 'nickelodeon', 'cn'] },
                { id: 'music', label: 'Music', keywords: ['music', 'mtv', 'vh1', 'concert'] },
                { id: 'doc', label: 'Doc/Nature', keywords: ['doc', 'nature', 'discovery', 'national geographic', 'animal'] },
                { id: 'entertainment', label: 'Entertainment', keywords: ['entertainment', 'comedy', 'show', 'life', 'colors'] },
                { id: 'religion', label: 'Religion', keywords: ['religion', 'islam', 'quran', 'peace tv', 'faith'] }
            ],
            regions: [
                { id: 'bd', label: 'Bangladesh', keywords: ['bangladesh', 'bd', 'bengali', 'dhaka'] },
                { id: 'in', label: 'India', keywords: ['india', 'in', 'hindi', 'tamil', 'telugu'] },
                { id: 'pk', label: 'Pakistan', keywords: ['pakistan', 'pk', 'urdu', 'ary', 'geo'] },
                { id: 'intl', label: 'International', keywords: ['usa', 'uk', 'europe', 'arab', 'middle east'] }
            ]
        };

        // DOM Elements
        const DOM = {
            urlInput: document.getElementById('urlInput'),
            fetchUrlBtn: document.getElementById('fetchUrlBtn'),
            fileInput: document.getElementById('fileInput'),
            channelGrid: document.getElementById('channelGrid'),
            channelCount: document.getElementById('channelCount'),
            categoryFilters: document.getElementById('categoryFilters'),
            regionFilters: document.getElementById('regionFilters'),
            searchInput: document.getElementById('searchInput'),
            videoPlayer: document.getElementById('videoPlayer'),
            playerOverlay: document.getElementById('playerOverlay'),
            nowPlayingName: document.getElementById('nowPlayingName'),
            nowPlayingGroup: document.getElementById('nowPlayingGroup'),
            testStreamsBtn: document.getElementById('testStreamsBtn'),
            testProgress: document.getElementById('testProgress'),
            testProgressBar: document.getElementById('testProgressBar'),
            filterWorkingBtn: document.getElementById('filterWorkingBtn'),
            workingBtnIcon: document.getElementById('workingBtnIcon'),
            settingsOverlay: document.getElementById('settingsOverlay'),
            settingsContent: document.getElementById('settingsContent'),
            openSettingsBtn: document.getElementById('openSettingsBtn'),
            closeSettingsBtn: document.getElementById('closeSettingsBtn'),
            exportJsonBtn: document.getElementById('exportJsonBtn'),
            exportM3u8Btn: document.getElementById('exportM3u8Btn'),
            exportModal: document.getElementById('exportModal'),
            exportModalTitle: document.getElementById('exportModalTitle'),
            exportArea: document.getElementById('exportArea'),
            closeExportBtn: document.getElementById('closeExportBtn'),
            copyExportBtn: document.getElementById('copyExportBtn')
        };

        function initUI() {
            // Settings Modal Logic
            const openSettings = () => {
                DOM.settingsOverlay.classList.remove('hidden');
                DOM.settingsOverlay.classList.add('flex');
                setTimeout(() => {
                    DOM.settingsOverlay.classList.remove('opacity-0');
                    DOM.settingsContent.classList.remove('scale-95');
                }, 10);
            };
            const closeSettings = () => {
                DOM.settingsOverlay.classList.add('opacity-0');
                DOM.settingsContent.classList.add('scale-95');
                setTimeout(() => {
                    DOM.settingsOverlay.classList.add('hidden');
                    DOM.settingsOverlay.classList.remove('flex');
                }, 300);
            };

            DOM.openSettingsBtn.addEventListener('click', openSettings);
            DOM.closeSettingsBtn.addEventListener('click', closeSettings);
            DOM.settingsOverlay.addEventListener('click', (e) => {
                if (e.target === DOM.settingsOverlay) closeSettings();
            });

            // Build Sidebar Filters
            filterConfig.categories.forEach(cat => {
                const btn = createSidebarFilter(cat.label, () => toggleFilter(activeCategories, cat.id, btn));
                DOM.categoryFilters.appendChild(btn);
            });

            filterConfig.regions.forEach(reg => {
                const btn = createSidebarFilter(reg.label, () => toggleFilter(activeRegions, reg.id, btn));
                DOM.regionFilters.appendChild(btn);
            });

            DOM.fileInput.addEventListener('change', handleFileUpload);
            DOM.fetchUrlBtn.addEventListener('click', handleUrlFetch);
            
            DOM.searchInput.addEventListener('input', (e) => {
                searchQuery = e.target.value.toLowerCase();
                renderChannels();
            });

            DOM.filterWorkingBtn.addEventListener('click', () => {
                filterWorkingOnly = !filterWorkingOnly;
                if(filterWorkingOnly) {
                    DOM.filterWorkingBtn.classList.replace('text-gray-400', 'text-white');
                    DOM.filterWorkingBtn.classList.replace('border-white/10', 'border-emerald-500/50');
                    DOM.workingBtnIcon.classList.replace('bg-gray-600', 'bg-emerald-500');
                    DOM.workingBtnIcon.classList.add('shadow-[0_0_8px_rgba(16,185,129,0.8)]');
                } else {
                    DOM.filterWorkingBtn.classList.replace('text-white', 'text-gray-400');
                    DOM.filterWorkingBtn.classList.replace('border-emerald-500/50', 'border-white/10');
                    DOM.workingBtnIcon.classList.replace('bg-emerald-500', 'bg-gray-600');
                    DOM.workingBtnIcon.classList.remove('shadow-[0_0_8px_rgba(16,185,129,0.8)]');
                }
                renderChannels();
            });

            DOM.testStreamsBtn.addEventListener('click', runPlayabilityTest);

            DOM.exportJsonBtn.addEventListener('click', () => { closeSettings(); generateExport('json'); });
            DOM.exportM3u8Btn.addEventListener('click', () => { closeSettings(); generateExport('m3u8'); });
            DOM.closeExportBtn.addEventListener('click', () => DOM.exportModal.classList.replace('flex', 'hidden'));
            DOM.copyExportBtn.addEventListener('click', copyExport);
            
            // Auto-fetch default URL on load
            DOM.fetchUrlBtn.click();
        }

        function createSidebarFilter(label, onClick) {
            const btn = document.createElement('button');
            btn.className = "px-3 py-1.5 bg-[#111] hover:bg-[#222] text-gray-400 rounded-lg text-xs font-semibold transition-all border border-white/5 focus-ring";
            btn.textContent = label;
            btn.addEventListener('click', onClick);
            return btn;
        }

        function toggleFilter(set, id, btnElement) {
            if (set.has(id)) {
                set.delete(id);
                btnElement.classList.replace('bg-white', 'bg-[#111]');
                btnElement.classList.replace('text-black', 'text-gray-400');
            } else {
                set.add(id);
                btnElement.classList.replace('bg-[#111]', 'bg-white');
                btnElement.classList.replace('text-gray-400', 'text-black');
            }
            renderChannels();
        }

        function parseM3U8(data) {
            const lines = data.split('\n');
            const parsed = [];
            let current = null;

            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const nameParts = line.split(',');
                    const name = nameParts.length > 1 ? nameParts.slice(1).join(',').trim() : "Unknown";
                    
                    const groupMatch = line.match(/group-title="([^"]+)"/i);
                    const countryMatch = line.match(/tvg-country="([^"]+)"/i);
                    const logoMatch = line.match(/tvg-logo="([^"]+)"/i);

                    current = {
                        name: name.replace(/"/g, '\\"'),
                        group: groupMatch ? groupMatch[1] : 'General',
                        country: countryMatch ? countryMatch[1] : '',
                        logo: logoMatch ? logoMatch[1] : null,
                        rawSearchString: `${name} ${groupMatch ? groupMatch[1] : ''} ${countryMatch ? countryMatch[1] : ''}`.toLowerCase(),
                        status: 'untested' 
                    };
                } else if (line.startsWith('http') && current) {
                    current.url = line;
                    parsed.push(current);
                    current = null;
                }
            }
            return parsed;
        }

        async function handleUrlFetch() {
            const url = DOM.urlInput.value.trim();
            if (!url) return;
            
            const originalText = DOM.fetchUrlBtn.textContent;
            DOM.fetchUrlBtn.textContent = 'Loading...';
            DOM.channelGrid.innerHTML = '<div class="col-span-full text-center py-20 text-gray-500 text-sm font-medium animate-pulse">Fetching Playlist...</div>';

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.text();
                allChannels = parseM3U8(data);
                
                // If it's the auto-load, silently close settings if they happened to open it immediately
                renderChannels();
            } catch (err) {
                DOM.channelGrid.innerHTML = `<div class="col-span-full text-center py-20 text-red-500 text-sm bg-red-500/10 rounded-xl border border-red-500/20 max-w-lg mx-auto">Error: ${err.message}.<br><br>Use the Settings to upload a local file if URLs are blocked.</div>`;
            } finally {
                DOM.fetchUrlBtn.textContent = originalText;
            }
        }

        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            DOM.channelGrid.innerHTML = '<div class="col-span-full text-center py-20 text-gray-500 text-sm font-medium animate-pulse">Parsing File...</div>';
            
            reader.onload = function(event) {
                const data = event.target.result;
                allChannels = parseM3U8(data);
                renderChannels();
                // Close settings overlay automatically after upload
                DOM.closeSettingsBtn.click(); 
            };
            reader.readAsText(file);
        }

        function getFilteredChannels() {
            return allChannels.filter(ch => {
                if (filterWorkingOnly && ch.status !== 'working') return false;
                if (searchQuery && !ch.rawSearchString.includes(searchQuery)) return false;

                let matchesCategory = activeCategories.size === 0;
                if (activeCategories.size > 0) {
                    for (const catId of activeCategories) {
                        const catConfig = filterConfig.categories.find(c => c.id === catId);
                        if (catConfig.keywords.some(kw => ch.rawSearchString.includes(kw))) {
                            matchesCategory = true;
                            break;
                        }
                    }
                }
                if (!matchesCategory) return false;

                let matchesRegion = activeRegions.size === 0;
                if (activeRegions.size > 0) {
                    for (const regId of activeRegions) {
                        const regConfig = filterConfig.regions.find(r => r.id === regId);
                        if (ch.country.toLowerCase() === regId || regConfig.keywords.some(kw => ch.rawSearchString.includes(kw))) {
                            matchesRegion = true;
                            break;
                        }
                    }
                }
                if (!matchesRegion) return false;

                return true;
            });
        }

        function renderChannels() {
            const filtered = getFilteredChannels();
            DOM.channelCount.textContent = `${filtered.length} Channels`;
            DOM.channelGrid.innerHTML = '';

            if (filtered.length === 0) {
                DOM.channelGrid.innerHTML = '<div class="col-span-full text-center py-20 text-gray-600 text-sm font-medium">No channels match criteria.</div>';
                return;
            }

            const fragment = document.createDocumentFragment();
            const displayLimit = Math.min(filtered.length, 500); 

            for (let i = 0; i < displayLimit; i++) {
                const ch = filtered[i];
                
                // Clean Card Design
                const btn = document.createElement('button');
                btn.className = "group relative flex flex-col items-center justify-center p-3 bg-[#0a0a0a] rounded-xl border border-white/5 hover:border-white/20 hover:bg-[#111] focus-ring transition-all aspect-[4/3] outline-none overflow-hidden";
                
                let statusIndicator = '';
                if (ch.status === 'working') {
                    statusIndicator = '<div class="absolute top-2 right-2 w-2 h-2 bg-emerald-500 rounded-full shadow-[0_0_8px_rgba(16,185,129,0.8)] z-10"></div>';
                    btn.classList.add('border-emerald-500/30');
                } else if (ch.status === 'error') {
                    statusIndicator = '<div class="absolute top-2 right-2 w-2 h-2 bg-red-600/50 rounded-full z-10"></div>';
                    btn.classList.add('opacity-50', 'grayscale');
                }
                
                btn.onclick = () => {
                    playStream(ch.url, ch.name, ch.group);
                    window.scrollTo({top: 0, behavior: 'smooth'});
                };

                const icon = getEmojiForGroup(ch.group);
                
                btn.innerHTML = `
                    ${statusIndicator}
                    <div class="flex-grow flex items-center justify-center w-full mb-2 z-0">
                        ${ch.logo 
                            ? `<img src="${ch.logo}" class="max-h-12 max-w-[70%] object-contain opacity-90 group-hover:opacity-100 transition-opacity" onerror="this.outerHTML='<span class=\\'text-3xl opacity-50\\'>${icon}</span>'">` 
                            : `<span class="text-3xl opacity-50">${icon}</span>`
                        }
                    </div>
                    <div class="w-full text-center mt-auto z-10">
                        <h3 class="text-gray-200 font-semibold text-xs truncate w-full px-1">${ch.name}</h3>
                        <p class="text-[10px] text-gray-500 font-medium truncate mt-0.5">${ch.group}</p>
                    </div>
                `;
                fragment.appendChild(btn);
            }
            
            if(filtered.length > 500) {
                const warning = document.createElement('div');
                warning.className = "col-span-full text-center py-6 text-xs text-amber-500/80";
                warning.textContent = `Showing 500 of ${filtered.length} results. Use filters to narrow down.`;
                fragment.appendChild(warning);
            }

            DOM.channelGrid.appendChild(fragment);
        }

        async function runPlayabilityTest() {
            if (isTesting) return;
            const filtered = getFilteredChannels();
            if (filtered.length === 0) return alert("No channels to test.");
            
            if (filtered.length > 200) {
                const proceed = confirm(`Testing ${filtered.length} channels locally might take time. Proceed?`);
                if (!proceed) return;
            }

            isTesting = true;
            DOM.testStreamsBtn.innerHTML = `<span class="animate-pulse">⏳</span> Testing...`;
            DOM.testStreamsBtn.classList.replace('text-indigo-400', 'text-gray-400');
            DOM.testProgress.classList.remove('hidden');
            
            let completed = 0;
            
            const testStream = (channel) => {
                return new Promise((resolve) => {
                    if (!Hls.isSupported()) return resolve(); 
                    const hlsTest = new Hls({ debug: false, maxMaxBufferLength: 1, maxBufferLength: 1 });
                    
                    const timeout = setTimeout(() => {
                        channel.status = 'error';
                        hlsTest.destroy();
                        resolve();
                    }, 4000);

                    hlsTest.on(Hls.Events.MANIFEST_PARSED, () => {
                        clearTimeout(timeout);
                        channel.status = 'working';
                        hlsTest.destroy();
                        resolve();
                    });

                    hlsTest.on(Hls.Events.ERROR, (event, data) => {
                        if (data.fatal) {
                            clearTimeout(timeout);
                            channel.status = 'error';
                            hlsTest.destroy();
                            resolve();
                        }
                    });
                    hlsTest.loadSource(channel.url);
                });
            };

            const chunkSize = 3;
            for (let i = 0; i < filtered.length; i += chunkSize) {
                const chunk = filtered.slice(i, i + chunkSize);
                await Promise.all(chunk.map(ch => testStream(ch)));
                
                completed += chunk.length;
                const percent = Math.min(100, Math.round((completed / filtered.length) * 100));
                DOM.testProgressBar.style.width = `${percent}%`;
                if (i % 15 === 0) renderChannels(); 
            }

            renderChannels();
            isTesting = false;
            DOM.testStreamsBtn.innerHTML = `<span>✔️</span> Test Complete!`;
            DOM.testStreamsBtn.classList.replace('text-gray-400', 'text-emerald-400');
            
            setTimeout(() => {
                DOM.testProgress.classList.add('hidden');
                DOM.testProgressBar.style.width = `0%`;
                DOM.testStreamsBtn.innerHTML = `<span>📡</span> Test Playability (BD)`;
                DOM.testStreamsBtn.classList.replace('text-emerald-400', 'text-indigo-400');
            }, 3000);
        }

        function playStream(url, name, group) {
            DOM.playerOverlay.style.opacity = '0';
            DOM.nowPlayingName.textContent = name;
            DOM.nowPlayingGroup.textContent = group || 'Unknown Category';

            if (hls) hls.destroy();

            if (Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(DOM.videoPlayer);
                hls.on(Hls.Events.MANIFEST_PARSED, () => {
                    DOM.videoPlayer.play().catch(e => console.log("Autoplay prevented", e));
                });
                hls.on(Hls.Events.ERROR, (event, data) => {
                    if (data.fatal) {
                        DOM.nowPlayingName.textContent = "Error: Stream Offline / Geoblocked";
                        DOM.nowPlayingName.classList.add('text-red-500');
                    }
                });
            } 
            else if (DOM.videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                DOM.videoPlayer.src = url;
                DOM.videoPlayer.addEventListener('loadedmetadata', () => DOM.videoPlayer.play());
            }
        }

        function getEmojiForGroup(group) {
            const g = (group || '').toUpperCase();
            if (g.includes('SPORT') || g.includes('TSPORT')) return '🏃';
            if (g.includes('NEWS')) return '📰';
            if (g.includes('MOVIE') || g.includes('FILM')) return '🎬';
            if (g.includes('KID')) return '🧸';
            if (g.includes('MUSIC')) return '🎵';
            if (g.includes('DOC')) return '🌍';
            if (g.includes('RELIGION')) return '🕌';
            return '📺';
        }

        function generateExport(format) {
            const filtered = getFilteredChannels();
            if (filtered.length === 0) return alert("No channels to export.");

            if (format === 'json') {
                DOM.exportModalTitle.textContent = "JSON Payload";
                const jsonStrings = filtered.map(ch => {
                    const icon = getEmojiForGroup(ch.group);
                    return `{"name":"${ch.name}", "url":"${ch.url}", "icon":"${icon}", "group":"${ch.group}"}`;
                });
                DOM.exportArea.value = jsonStrings.join(',\n') + (jsonStrings.length > 0 ? ',' : '');
            } 
            else if (format === 'm3u8') {
                DOM.exportModalTitle.textContent = "M3U8 Playlist";
                let m3u8Content = "#EXTM3U\n";
                filtered.forEach(ch => {
                    m3u8Content += `#EXTINF:-1 group-title="${ch.group}" tvg-country="${ch.country}" tvg-logo="${ch.logo || ''}",${ch.name}\n${ch.url}\n`;
                });
                DOM.exportArea.value = m3u8Content;
            }

            DOM.exportModal.classList.replace('hidden', 'flex');
        }

        function copyExport() {
            DOM.exportArea.select();
            document.execCommand('copy');
            const originalText = DOM.copyExportBtn.textContent;
            DOM.copyExportBtn.textContent = 'Copied!';
            DOM.copyExportBtn.classList.replace('bg-blue-600', 'bg-emerald-600');
            setTimeout(() => {
                DOM.copyExportBtn.textContent = originalText;
                DOM.copyExportBtn.classList.replace('bg-emerald-600', 'bg-blue-600');
            }, 2000);
        }

        // Boot
        window.addEventListener('DOMContentLoaded', initUI);

    </script>
</body>
</html>
